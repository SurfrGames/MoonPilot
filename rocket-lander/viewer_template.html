<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Orbit3D Mission Viewer</title>
<style>
:root{--bg:#05070c;--panel:rgba(12,18,28,.8);--line:#263247;--text:#e6edf7;--dim:#8fa0b8;--accent:#ffb454}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:13px/1.45 system-ui,"Segoe UI",sans-serif;overflow:hidden}
canvas{display:block;touch-action:none}
.panel{position:fixed;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
#hud{top:12px;left:12px;width:230px}
#hud small{color:var(--dim);letter-spacing:.08em;text-transform:uppercase}
#phase{font-size:20px;font-weight:600;color:var(--accent);margin:2px 0 6px}
.row{display:flex;justify-content:space-between;font-variant-numeric:tabular-nums}
.row span:first-child{color:var(--dim)}
#outcome{color:var(--dim);margin-top:8px;border-top:1px solid var(--line);padding-top:6px}
#bar{left:12px;right:12px;bottom:12px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
#scrub{flex:1;min-width:120px;accent-color:var(--accent)}
button,select{background:#111a29;color:var(--text);border:1px solid var(--line);border-radius:6px;padding:6px 10px;font:inherit;cursor:pointer}
button.on{border-color:var(--accent);color:var(--accent)}
#hint{top:12px;right:12px;color:var(--dim);font-size:12px}
@media(max-width:560px){#hint{display:none}#hud{width:190px}}
</style>
</head>
<body>
<div id="hud" class="panel">
  <small>Moon mission</small>
  <div id="phase">–</div>
  <div class="row"><span>Mission time</span><span id="t"></span></div>
  <div class="row"><span>Altitude</span><span id="h"></span></div>
  <div class="row"><span>Speed over ground</span><span id="vh"></span></div>
  <div class="row"><span>Vertical speed</span><span id="vr"></span></div>
  <div class="row"><span>Throttle</span><span id="thr"></span></div>
  <div class="row"><span>Fuel</span><span id="fuel"></span></div>
  <div class="row"><span>Playback</span><span id="warp"></span></div>
  <div id="outcome"></div>
</div>
<div id="hint" class="panel">Drag to look around · scroll to zoom</div>
<div id="bar" class="panel">
  <button id="play">Pause</button>
  <select id="mission" title="How far through training this flight was recorded"></select>
  <input id="scrub" type="range" min="0" value="0" step="0.01">
  <select id="rate"><option value="12">Slow</option><option value="40" selected>Normal</option><option value="140">Fast</option></select>
  <button id="follow" class="on">Follow rocket</button>
  <button id="whole">Whole Moon</button>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const MISSIONS = /*MISSIONS*/[];
const R = 1737.4, OMEGA = 2.6617e-6, KM = 1e-3;
const PHASES = ["Launch", "Orbit", "Landing"], COLORS = [[1, .7, .33], [.35, .76, 1], [.5, .89, .55]];
const $ = id => document.getElementById(id), V = (x, y, z) => new THREE.Vector3(x, y, z), Z = V(0, 0, 1);

const renderer = new THREE.WebGLRenderer({antialias: true, logarithmicDepthBuffer: true});
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene(), camera = new THREE.PerspectiveCamera(50, 1, 0.002, 1e6);
scene.add(new THREE.AmbientLight(0x9aa8c8, .4));
const sun = new THREE.DirectionalLight(0xffffff, 1.2);
scene.add(sun);

// ---- procedural textures (no image downloads) ----
let seed = 7;
const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
function canvasTex(w, h, draw) {
  const cv = document.createElement("canvas"); cv.width = w; cv.height = h;
  draw(cv.getContext("2d"), w, h);
  const t = new THREE.CanvasTexture(cv); t.anisotropy = 8; return t;
}
function craters(g, w, h, count, rmin, rmax) {
  for (let i = 0; i < count; i++) {
    const x = rnd() * w, y = rnd() * h, r = rmin + (rmax - rmin) * rnd() ** 3;
    const gr = g.createRadialGradient(x, y, 0, x, y, r);
    gr.addColorStop(0, "rgba(40,40,44,.55)"); gr.addColorStop(.75, "rgba(60,60,64,.35)");
    gr.addColorStop(.9, "rgba(225,225,220,.5)"); gr.addColorStop(1, "rgba(150,150,150,0)");
    g.fillStyle = gr; g.beginPath(); g.arc(x, y, r, 0, 7); g.fill();
  }
}
function regolith(g, w, h, blobs) {
  g.fillStyle = "#8d8d8f"; g.fillRect(0, 0, w, h);
  for (let i = 0; i < blobs; i++) {
    const x = rnd() * w, y = rnd() * h, r = (0.03 + 0.12 * rnd()) * h, dark = rnd() < .6;
    const gr = g.createRadialGradient(x, y, 0, x, y, r);
    gr.addColorStop(0, dark ? "rgba(70,72,78,.35)" : "rgba(190,190,186,.25)"); gr.addColorStop(1, "rgba(128,128,128,0)");
    g.fillStyle = gr; g.beginPath(); g.arc(x, y, r, 0, 7); g.fill();
  }
}
const moonTex = canvasTex(2048, 1024, (g, w, h) => { regolith(g, w, h, 260); craters(g, w, h, 900, 2, 26); });
function patchTex(pad) {
  return canvasTex(1024, 1024, (g, w, h) => {
    regolith(g, w, h, 60); craters(g, w, h, 240, 3, 34);
    g.strokeStyle = "rgba(255,255,255,.07)"; g.lineWidth = 1;
    for (let i = 0; i <= 32; i++) { g.beginPath(); g.moveTo(i * 32, 0); g.lineTo(i * 32, h); g.moveTo(0, i * 32); g.lineTo(w, i * 32); g.stroke(); }
    if (pad) {
      g.strokeStyle = "rgba(255,180,84,.9)"; g.lineWidth = 3;
      g.beginPath(); g.arc(w / 2, h / 2, 14, 0, 7); g.moveTo(w / 2 - 22, h / 2); g.lineTo(w / 2 + 22, h / 2);
      g.moveTo(w / 2, h / 2 - 22); g.lineTo(w / 2, h / 2 + 22); g.stroke();
    }
    g.globalCompositeOperation = "destination-in";      // fade the edge so the patch blends into the Moon
    const f = g.createRadialGradient(w / 2, h / 2, w * .3, w / 2, h / 2, w / 2);
    f.addColorStop(0, "rgba(0,0,0,1)"); f.addColorStop(1, "rgba(0,0,0,0)");
    g.fillStyle = f; g.fillRect(0, 0, w, h);
  });
}

// ---- the Moon, stars, and curved close-up ground patches at the launch and landing sites ----
const moon = new THREE.Group(); scene.add(moon);
const ball = new THREE.Mesh(new THREE.SphereGeometry(R, 256, 128), new THREE.MeshLambertMaterial({map: moonTex}));
ball.rotation.x = Math.PI / 2; moon.add(ball);
{
  const p = new Float32Array(6000);
  for (let i = 0; i < 2000; i++) { const v = V(rnd() - .5, rnd() - .5, rnd() - .5).setLength(4e5); p.set([v.x, v.y, v.z], i * 3); }
  const g = new THREE.BufferGeometry(); g.setAttribute("position", new THREE.BufferAttribute(p, 3));
  scene.add(new THREE.Points(g, new THREE.PointsMaterial({color: 0xffffff, size: 1.4, sizeAttenuation: false})));
}
function patch(dir, radius, tex, lift, order) {
  const NR = 40, NS = 72, pos = [], uv = [], idx = [];
  for (let i = 0; i <= NR; i++) for (let j = 0; j <= NS; j++) {
    const a = (i / NR) * radius / R, p = (j / NS) * 2 * Math.PI;
    pos.push((R + lift) * Math.sin(a) * Math.cos(p), (R + lift) * Math.sin(a) * Math.sin(p), (R + lift) * Math.cos(a) - R);
    uv.push(.5 + .5 * (i / NR) * Math.cos(p), .5 + .5 * (i / NR) * Math.sin(p));
  }
  for (let i = 0; i < NR; i++) for (let j = 0; j < NS; j++) {
    const a = i * (NS + 1) + j, b = a + NS + 1; idx.push(a, b, a + 1, b, b + 1, a + 1);
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute("position", new THREE.Float32BufferAttribute(pos, 3)); g.setAttribute("uv", new THREE.Float32BufferAttribute(uv, 2));
  g.setIndex(idx); g.computeVertexNormals();
  const m = new THREE.Mesh(g, new THREE.MeshLambertMaterial({map: tex, transparent: true, depthWrite: false}));
  m.position.copy(dir).multiplyScalar(R); m.quaternion.setFromUnitVectors(Z, dir); m.renderOrder = order;
  return m;
}
const wideTex = patchTex(false), padTex = patchTex(true), nearTex = patchTex(false);
let patches = [];

// ---- the rocket (feet at its origin, nose along +Y) ----
const rocket = new THREE.Group(); scene.add(rocket);
const metal = c => new THREE.MeshStandardMaterial({color: c, metalness: 0, roughness: .7});
const part = (geo, mat, y) => { const m = new THREE.Mesh(geo, mat); m.position.y = y; rocket.add(m); return m; };
part(new THREE.CylinderGeometry(.0017, .0021, .006, 20), metal(0xdfe3ea), .0058);
part(new THREE.ConeGeometry(.0017, .003, 20), metal(0xffb454), .0103);
part(new THREE.CylinderGeometry(.0008, .0014, .002, 16, 1, true), metal(0x555b66), .0018);
for (let i = 0; i < 4; i++) {
  const leg = new THREE.Mesh(new THREE.CylinderGeometry(.00014, .00014, .0052), metal(0x9aa3b2));
  const a = i * Math.PI / 2 + Math.PI / 4;
  leg.position.set(Math.cos(a) * .0027, .0021, Math.sin(a) * .0027);
  leg.rotation.set(Math.sin(a) * .62, 0, -Math.cos(a) * .62); rocket.add(leg);
}
const flame = part(new THREE.ConeGeometry(.0011, .008, 14, 1, true), new THREE.MeshBasicMaterial({color: 0xffd9a0, transparent: true, opacity: .85, side: THREE.DoubleSide}), 0);
flame.rotation.x = Math.PI;
const dotGeo = new THREE.BufferGeometry(); dotGeo.setAttribute("position", new THREE.Float32BufferAttribute([0, 0, 0], 3));
const marker = new THREE.Points(dotGeo, new THREE.PointsMaterial({color: 0xffffff, size: 6, sizeAttenuation: false, depthTest: false}));
scene.add(marker);
let trail = null;

// ---- mission loading ----
let M = null, rows = [], head = 0, playing = true, endPause = 0;
const cam = {mode: "follow", az: .9, el: .28, zoom: 1, whole: 5200};
const at = (i, out) => { const r = rows[i]; out.set(r[1] * KM, r[2] * KM, r[3] * KM); if (out.length() < R) out.setLength(R); return out; };
function load(k) {
  M = MISSIONS[k]; rows = M.rows; head = 0; playing = true; $("play").textContent = "Pause";
  $("scrub").max = rows.length - 1; $("outcome").textContent = M.outcome;
  if (trail) scene.remove(trail);
  const p = new Float32Array(rows.length * 3), c = new Float32Array(rows.length * 3), v = V();
  rows.forEach((r, i) => { at(i, v); p.set([v.x, v.y, v.z], i * 3); c.set(COLORS[r[8]], i * 3); });
  const g = new THREE.BufferGeometry();
  g.setAttribute("position", new THREE.BufferAttribute(p, 3)); g.setAttribute("color", new THREE.BufferAttribute(c, 3));
  trail = new THREE.Line(g, new THREE.LineBasicMaterial({vertexColors: true})); trail.frustumCulled = false; scene.add(trail);
  patches.forEach(m => moon.remove(m));
  const pad = at(0, V()).normalize(), last = rows[rows.length - 1];
  const site = at(rows.length - 1, V()).normalize().applyAxisAngle(Z, -OMEGA * last[0]);   // into the Moon's rotating frame
  patches = [[pad, padTex], [site, nearTex]].flatMap(([d, close]) =>          // three levels of ground detail per site
    [patch(d, 40, wideTex, .004, 1), patch(d, 4, nearTex, .0043, 2), patch(d, .4, close, .0046, 3)]);
  patches.forEach(m => moon.add(m));
  sun.position.copy(pad).addScaledVector(V().crossVectors(pad, Z).normalize(), .9).addScaledVector(Z, .3);
}

// ---- controls ----
MISSIONS.forEach((m, i) => $("mission").add(new Option(m.label, i)));
$("mission").onchange = e => load(+e.target.value);
$("play").onclick = () => { if (head >= rows.length - 1) head = 0; playing = !playing; $("play").textContent = playing ? "Pause" : "Play"; };
$("scrub").oninput = e => { head = +e.target.value; };
const setMode = m => { cam.mode = m; $("follow").classList.toggle("on", m === "follow"); $("whole").classList.toggle("on", m === "whole"); };
$("follow").onclick = () => setMode("follow"); $("whole").onclick = () => setMode("whole");
let drag = null;
const el = renderer.domElement;
el.onpointerdown = e => { drag = [e.clientX, e.clientY]; el.setPointerCapture(e.pointerId); };
el.onpointerup = () => { drag = null; };
el.onpointermove = e => {
  if (!drag) return;
  cam.az -= (e.clientX - drag[0]) * .006; cam.el = Math.max(-.15, Math.min(1.5, cam.el + (e.clientY - drag[1]) * .006));
  drag = [e.clientX, e.clientY];
};
el.onwheel = e => {
  e.preventDefault(); const k = Math.exp(e.deltaY * .0012);
  if (cam.mode === "follow") cam.zoom = Math.max(.25, Math.min(400, cam.zoom * k)); else cam.whole = Math.max(2300, Math.min(30000, cam.whole * k));
};
function resize() { renderer.setSize(innerWidth, innerHeight); camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); }
addEventListener("resize", resize); resize();

// ---- frame loop ----
const P = V(), P2 = V(), D = V(), up = V(), east = V(), north = V(), Y = V(0, 1, 0);
const clock = t => { const s = Math.round(t), h = Math.floor(s / 3600), m = Math.floor(s / 60) % 60; return (h ? h + ":" + String(m).padStart(2, "0") : m) + ":" + String(s % 60).padStart(2, "0"); };
let prev = performance.now();
function frame(now) {
  requestAnimationFrame(frame);
  const dtReal = Math.min(.1, (now - prev) / 1000); prev = now;
  if (!M) return;
  const rate = +$("rate").value, end = rows.length - 1;
  if (playing) {
    head = Math.min(end, head + rate * dtReal);
    if (head >= end) { endPause += dtReal; if (endPause > 4) { head = 0; endPause = 0; } } else endPause = 0;
    $("scrub").value = head;
  }
  const i = Math.min(end - 1, Math.floor(head)), f = head - i, a = rows[i], b = rows[i + 1] || a;
  at(i, P); if (b !== a) P.lerp(at(i + 1, P2), f);
  if (P.length() < R) P.setLength(R);
  D.set(a[4], a[5], a[6]).lerp(P2.set(b[4], b[5], b[6]), f).normalize();
  const t = a[0] + (b[0] - a[0]) * f, mix = k => a[k] + (b[k] - a[k]) * f, h = Math.max(0, mix(9));
  moon.rotation.z = OMEGA * t;
  rocket.position.copy(P); rocket.quaternion.setFromUnitVectors(Y, D); marker.position.copy(P);
  const thr = head >= end ? 0 : b[7];
  flame.visible = thr > .01;
  const len = (.35 + thr) * (.9 + .2 * Math.random()); flame.scale.set(1, len, 1); flame.position.y = .001 - .004 * len;
  trail.geometry.setDrawRange(0, Math.min(rows.length, i + 2));

  // camera: orbit the rocket (pulling back as it climbs) or the whole Moon
  let dist;
  if (cam.mode === "follow") {
    up.copy(P).normalize(); east.crossVectors(Z, up); if (east.lengthSq() < 1e-6) east.set(1, 0, 0); east.normalize();
    north.crossVectors(up, east); dist = cam.zoom * (.07 + 1.6 * h * KM);
    P2.copy(P).addScaledVector(up, .006);
  } else { up.copy(Z); east.set(1, 0, 0); north.set(0, 1, 0); dist = cam.whole; P2.set(0, 0, 0); }
  camera.position.copy(P2).addScaledVector(up, Math.sin(cam.el) * dist)
    .addScaledVector(east, Math.cos(cam.el) * Math.cos(cam.az) * dist).addScaledVector(north, Math.cos(cam.el) * Math.sin(cam.az) * dist);
  camera.up.copy(up); camera.lookAt(P2);
  rocket.visible = dist < 6; marker.visible = dist > 1.5;

  $("phase").textContent = PHASES[a[8]];
  $("t").textContent = clock(t);
  $("h").textContent = h < 2000 ? h.toFixed(0) + " m" : (h * KM).toFixed(1) + " km";
  $("vh").textContent = mix(11).toFixed(mix(11) < 100 ? 1 : 0) + " m/s";
  $("vr").textContent = (mix(10) > 0 ? "+" : "") + mix(10).toFixed(1) + " m/s";
  $("thr").textContent = (thr * 100).toFixed(0) + "%";
  $("fuel").textContent = (mix(12) * 100).toFixed(0) + "%";
  $("warp").textContent = playing && head < end ? Math.round((b[0] - a[0]) * rate) + "× real time" : "paused";
  renderer.render(scene, camera);
}
if (MISSIONS.length) { $("mission").value = MISSIONS.length - 1; load(MISSIONS.length - 1); requestAnimationFrame(frame); }
else $("outcome").textContent = "No missions recorded yet. Run: uv run orbit3d.py train";
</script>
</body>
</html>
